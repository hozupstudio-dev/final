<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DISCOGRAPHY — Xdinary Heroes</title>
  <link rel="stylesheet" href="assets/css/common.css" />
  <style>
    html, body { height: 100%; }
    body { background:#05060a; overflow:hidden; }

    /* vertical scroll-snap deck: one full-screen video per album */
    .deck {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .deck::-webkit-scrollbar { display:none; }

    .album {
      position: relative;
      height: 100vh;
      scroll-snap-align: start;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .album video {
      position:absolute; inset:0; width:100%; height:100%;
      object-fit: cover; z-index:0;
    }
    /* fallback tint shown until/if the video paints */
    .album .bg-fallback {
      position:absolute; inset:0; z-index:0;
      background: var(--cover, linear-gradient(135deg,#1a2238,#0c1020));
    }
    .album .scrim {
      position:absolute; inset:0; z-index:1;
      background: radial-gradient(60% 60% at 50% 50%, rgba(0,0,0,0.15), rgba(0,0,0,0.55));
    }

    /* centered album logo */
    .album .logo {
      position: relative; z-index:2;
      width: min(560px, 78vw);
      opacity: 0; transform: translateY(24px) scale(0.98);
      transition: opacity 0.9s ease, transform 0.9s ease;
      filter: drop-shadow(0 0 26px rgba(120,150,255,0.45));
      pointer-events:none;
    }
    .album.in-view .logo { opacity:1; transform:none; }

    /* now-playing chip per album */
    .album .live-chip {
      position:absolute; left:50%; bottom:64px; transform:translateX(-50%);
      z-index:2; display:flex; align-items:center; gap:10px;
      font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:#cfd6e6;
      background:rgba(0,0,0,0.35); padding:8px 16px; border-radius:999px;
      backdrop-filter: blur(5px); opacity:0; transition:opacity .6s;
    }
    .album.in-view .live-chip { opacity:1; }
    .live-chip .live { width:8px;height:8px;border-radius:50%;background:#ff4d6a;box-shadow:0 0 10px #ff4d6a; }
    .album.playing .live-chip .live { animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }
    .live-chip .wave { display:flex; align-items:flex-end; gap:3px; height:12px; }
    .live-chip .wave span { width:3px; height:30%; background:var(--accent); border-radius:2px; }
    .album.playing .live-chip .wave span { animation: wv .9s ease-in-out infinite; }
    .live-chip .wave span:nth-child(2){animation-delay:.15s}
    .live-chip .wave span:nth-child(3){animation-delay:.3s}
    @keyframes wv { 0%,100%{height:30%} 50%{height:100%} }

    /* page-side progress dots */
    .dots {
      position: fixed; right: 26px; top:50%; transform:translateY(-50%);
      z-index: 50; display:flex; flex-direction:column; gap:14px;
    }
    .dots button {
      width:10px; height:10px; border-radius:50%; border:1px solid rgba(255,255,255,0.5);
      background:transparent; cursor:pointer; padding:0; transition:all .25s;
    }
    .dots button.active { background:#fff; box-shadow:0 0 12px rgba(255,255,255,0.7); transform:scale(1.2); }

    /* scroll hint (first screen only) */
    .scroll-cue {
      position: fixed; left:50%; bottom:26px; transform:translateX(-50%);
      z-index:50; color:rgba(255,255,255,0.7); font-size:12px; letter-spacing:0.2em;
      text-transform:uppercase; display:flex; flex-direction:column; align-items:center; gap:6px;
      transition: opacity .4s;
    }
    .scroll-cue .arrow { animation: bob 1.6s ease-in-out infinite; }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(6px)} }

    /* sound toggle */
    .sound-toggle {
      position: fixed; right: 26px; bottom: 26px; z-index: 60;
      display:flex; align-items:center; gap:10px; padding:12px 18px; border-radius:999px;
      background: rgba(15,18,26,0.8); border:1px solid rgba(255,255,255,0.14);
      cursor:pointer; backdrop-filter: blur(8px); font-size:13px;
    }
    .sound-toggle:hover { border-color: var(--accent); }

    .home-link {
      position: fixed; left:24px; top:22px; z-index:60;
      font-size:12px; letter-spacing:0.15em; color:rgba(255,255,255,0.6);
    }
    .home-link:hover { color:#fff; }
  </style>
</head>
<body>
  <a class="home-link" href="index.html">‹ HOME</a>

  <div class="deck" id="deck">
    <section class="album in-view" data-start="42" data-dot="0" style="--cover:linear-gradient(135deg,#241a3a,#0c1020)">
      <div class="bg-fallback"></div>
      <video muted loop playsinline preload="auto" data-src="assets/media/troubleshooting.mp4"></video>
      <div class="scrim"></div>
      <img class="logo" src="assets/media/logos/hello.svg" alt="Hello, world!" />
      <div class="live-chip"><span class="live"></span> Title Chorus
        <span class="wave"><span></span><span></span><span></span></span></div>
    </section>

    <section class="album" data-start="50" data-dot="1" style="--cover:linear-gradient(135deg,#3a1a24,#0c1020)">
      <div class="bg-fallback"></div>
      <video muted loop playsinline preload="auto" data-src="assets/media/hairdye.mp4"></video>
      <div class="scrim"></div>
      <img class="logo" src="assets/media/logos/overload.svg" alt="Overload" />
      <div class="live-chip"><span class="live"></span> Title Chorus
        <span class="wave"><span></span><span></span><span></span></span></div>
    </section>

    <section class="album" data-start="38" data-dot="2" style="--cover:linear-gradient(135deg,#1a2e3a,#0c1020)">
      <div class="bg-fallback"></div>
      <video muted loop playsinline preload="auto" data-src="assets/media/breakthrough.mp4"></video>
      <div class="scrim"></div>
      <img class="logo" src="assets/media/logos/deadlock.svg" alt="Deadlock" />
      <div class="live-chip"><span class="live"></span> Title Chorus
        <span class="wave"><span></span><span></span><span></span></span></div>
    </section>

    <section class="album" data-start="46" data-dot="3" style="--cover:linear-gradient(135deg,#2a2333,#0c1020)">
      <div class="bg-fallback"></div>
      <video muted loop playsinline preload="auto" data-src="assets/media/deadand.mp4"></video>
      <div class="scrim"></div>
      <img class="logo" src="assets/media/logos/deadand.svg" alt="DEAD AND" />
      <div class="live-chip"><span class="live"></span> Title Chorus
        <span class="wave"><span></span><span></span><span></span></span></div>
    </section>
  </div>

  <div class="dots" id="dots"></div>

  <div class="scroll-cue" id="scrollCue">
    <span>Scroll</span><span class="arrow">▾</span>
  </div>

  <button class="sound-toggle" id="soundToggle">
    <span id="soundIcon">🔇</span> <span id="soundLabel">소리 켜기</span>
  </button>

  <script src="assets/js/discography.js"></script>
</body>
</html>
